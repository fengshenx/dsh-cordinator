# dsh-coordinator bundle 的插件层。
# 每一行是一个 Cordis 插件；`name` 指向本包内的模块，由 Node 解析。
#
# `name` 必须是**纯包名**：浏览器侧靠 Loader 行名定位包 manifest 才能发现本包的
# client 半边。写成 `dsh-coordinator/src/host` 这样的子路径，宿主定位不到包根，
# 便不会把 client bundle 下发给浏览器——右栏也就看不到看板。
#
# `subagents` 必须显式声明：Cordis 只把已声明的服务暴露给插件作用域，
# 未声明时 `ctx.get('subagents')` 拿不到，派工器就派不出 worker。
#
# `sessionController` 不能声明：它只挂在 web-app bundle 上，声明成必需依赖会让
# headless 等不含该服务的 profile 整个插件挂起。它改由 `ctx.get()` 惰性获取，
# 缺失时唤醒能力降级而非失效。
#
# `sessionQuery` 同样走惰性获取：它由 sqlite 引擎提供，引擎可能被部署替换。
#
# 这里的 `inject` 列表**不写**：与 dsh 官方 bundle 一致，服务依赖由模块自己的
# `export const inject` 声明。在 patch 里另写一份会与模块声明脱节——模块新增
# 依赖时，patch 里的旧列表会让插件在访问新服务时抛「without inject」。
- insert:
    - id: coordinator-host
      name: 'dsh-coordinator'
